name: TikTok daily video

on:
  schedule:
    - cron: '7 5 * * *'   # giờ UTC → 12:07 giờ VN
  workflow_dispatch:        # nút "Run workflow" để chạy tay

permissions:
  contents: write           # để commit state/video-tiktok.json + state/video-tiktok-retry.json
  actions: read             # để tải artifact video của lần chạy trước khi cần gửi bù

concurrency:
  group: video-tiktok
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Video bị TikTok từ chối lần trước (vd hộp nháp đầy) được ghi trong state/video-tiktok-retry.json:
      # tải lại từ artifact của lần chạy đó (giữ 7 ngày) và gửi trước, tối đa 2 video / lần.
      # Đặt trước bước làm video để vẫn gửi bù được khi hôm nay làm video bị lỗi.
      - name: Gửi bù video TikTok bị lỗi lần trước
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_POST_MODE: inbox
        run: python video/publish.py --to tiktok --retry --retry-state state/video-tiktok-retry.json --dir run/retry

      - name: Cài FFmpeg, font và thư viện
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet pillow

      - name: Bật VoiceStudio (Docker bản CPU) và thử đọc 1 câu bằng giọng nam
        id: voicestudio            # không có giọng dự phòng: hỏng ở đây thì workflow dừng
        env:
          VS_VOICE: ${{ vars.VOICESTUDIO_VOICE }}
          VS_INSTRUCT: ${{ vars.VOICESTUDIO_INSTRUCT }}
        run: |
          KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$KEY"
          docker run -d --name voicestudio -p 127.0.0.1:3900:3900 \
            -e OMNIVOICE_API_KEY="$KEY" -e OMNIVOICE_ANALYTICS_DISABLED=1 \
            -e OMNIVOICE_DATA_DIR=/app/omnivoice_data \
            ghcr.io/debpalash/voicestudio:stable
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3900/.well-known/voicestudio-speech >/dev/null && break
            sleep 10
          done
          curl -sf --max-time 600 http://127.0.0.1:3900/v1/audio/speech \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"tts-1\",\"input\":\"Xin chào, đây là giọng thử.\",\"voice\":\"${VS_VOICE:-default}\",\"instructions\":\"${VS_INSTRUCT:-male, middle-aged, low pitch}\",\"response_format\":\"mp3\"}" \
            -o /tmp/probe.mp3
          test "$(stat -c%s /tmp/probe.mp3)" -gt 2000
          echo "VOICESTUDIO_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Nhật ký VoiceStudio nếu không chạy được
        if: failure() && steps.voicestudio.outcome == 'failure'
        run: docker logs --tail 80 voicestudio || true

      - name: Làm video (Gemini viết lời + chọn ảnh, giọng đọc, FFmpeg dựng)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICESTUDIO_VOICE: ${{ vars.VOICESTUDIO_VOICE }}
          VOICESTUDIO_INSTRUCT: ${{ vars.VOICESTUDIO_INSTRUCT }}
        run: python video/auto_video.py --out run/video --count 1 --state video-tiktok

      - name: Đăng video lên TikTok (hộp nháp như flow ảnh)
        continue-on-error: true      # đăng lỗi thì vẫn lưu state + video trong artifact
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_POST_MODE: inbox
        run: python video/publish.py --dir run/video --to tiktok --retry-state state/video-tiktok-retry.json --run-id ${{ github.run_id }}

      - name: Lưu danh sách bài đã làm
        if: always()
        run: |
          for f in state/video-tiktok.json state/video-tiktok-retry.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cập nhật danh sách bài video TikTok đã làm"
          git pull --rebase
          git push

      - name: Lưu video + caption (tải về trong 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-tiktok-${{ github.run_id }}
          path: run/video/
          retention-days: 7
          if-no-files-found: ignore
