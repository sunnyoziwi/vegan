name: TikTok daily slides

on:
  schedule:
    - cron: '7 8 * * *'    # giờ UTC → 15:07 giờ VN
  workflow_dispatch:        # nút "Run workflow" để chạy tay

permissions:
  contents: write           # để commit state/tiktok.json

concurrency:
  group: tiktok-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Chạy workflow n8n
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash ci/run-workflow.sh tiktok

      - name: Lưu danh sách bài đã làm
        if: always()
        run: |
          git diff --quiet -- state/tiktok.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tiktok.json
          git commit -m "Cập nhật danh sách bài TikTok đã làm"
          git pull --rebase
          git push

      - name: Lưu ảnh + caption TikTok (tải về trong 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ github.run_id }}
          path: run/output/
          retention-days: 7
          if-no-files-found: ignore
