name: TikTok daily slides

on:
  schedule:
    - cron: '7 8 * * *'    # giờ UTC → 15:07 giờ VN
  workflow_dispatch:        # nút "Run workflow" để chạy tay

permissions:
  contents: write           # để commit state/tiktok.json

concurrency:
  group: tiktok-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Còn bài ảnh bị TikTok từ chối đang chờ gửi bù (queue.json của vegan-legal) thì hôm nay không làm bài mới:
      # workflow "Publish due TikTok posts" vẫn gửi bù 3 giờ / lần. Không đọc được queue.json thì làm bài mới như thường.
      - name: Có bài ảnh đang chờ gửi bù không?
        id: backlog
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          auth=(); [ -n "$GH_PAGES_TOKEN" ] && auth=(-H "Authorization: Bearer $GH_PAGES_TOKEN")
          n=$(curl -sf "${auth[@]}" -H "Accept: application/vnd.github.raw" \
                https://api.github.com/repos/sunnyoziwi/vegan-legal/contents/queue.json \
              | jq '[.[] | select(.retry == true and .status == "queued")] | length' 2>/dev/null || echo 0)
          echo "Bài ảnh chờ gửi bù: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "backfill=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Còn $n bài ảnh chờ gửi bù trên TikTok: hôm nay không làm bài mới"
          fi

      - name: Chạy workflow n8n
        if: steps.backlog.outputs.backfill != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # đẩy ảnh lên repo vegan-legal (GitHub Pages) + xếp lịch TikTok vào queue.json;
          # repo vegan-legal tự gửi bài đến giờ (workflow "Publish due TikTok posts" mỗi 15 phút)
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: bash ci/run-workflow.sh tiktok

      - name: Lưu danh sách bài đã làm
        if: always()
        run: |
          git diff --quiet -- state/tiktok.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tiktok.json
          git commit -m "Cập nhật danh sách bài TikTok đã làm"
          git pull --rebase
          git push

      - name: Lưu ảnh + caption TikTok (tải về trong 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ github.run_id }}
          path: run/output/
          retention-days: 7
          if-no-files-found: ignore
